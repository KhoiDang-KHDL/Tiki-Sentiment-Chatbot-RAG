name: tiki-rag-runtime
services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
    - 127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333
    volumes:
    - runtime_qdrant:/qdrant/storage
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: docker/runtime-api.Dockerfile
    image: tiki-rag-runtime-api:local
    env_file:
    - .env.runtime
    environment:
      QDRANT_URL: http://qdrant:6333
      API_ENABLE_METRICS: 'true'
      API_LOG_INTERACTIONS: 'true'
      HF_HOME: /opt/hf-cache
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    ports:
    - 127.0.0.1:${API_HOST_PORT:-8000}:8000
    volumes:
    - ./models:/app/models:ro
    - ./logs:/app/logs
    - runtime_hf:/opt/hf-cache
    depends_on:
    - qdrant
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=5)
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 20
    restart: unless-stopped
  ui:
    build:
      context: .
      dockerfile: docker/runtime-ui.Dockerfile
    image: tiki-rag-runtime-ui:local
    environment:
      API_BASE_URL: http://api:8000
      CHAINLIT_NO_TELEMETRY: 'true'
    ports:
    - 127.0.0.1:${UI_HOST_PORT:-8001}:8001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8001/',timeout=5)
      interval: 15s
      timeout: 10s
      retries: 12
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.10.0
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.retention.time=15d
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    - runtime_prometheus:/prometheus
    ports:
    - 127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090
    networks:
    - default
    - loadtest
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:9090/-/ready
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/setup_runtime.py}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
    - runtime_grafana:/var/lib/grafana
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
    - 127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:3000/api/health
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  api-loadtest:
    profiles:
    - loadtest
    build:
      context: .
      dockerfile: docker/ci.Dockerfile
    image: tiki-rag-runtime-fixture:local
    networks:
    - loadtest
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health');
        assert r.headers['X-Tiki-Loadtest']=='synthetic'
      interval: 5s
      timeout: 5s
      retries: 15
  locust:
    profiles:
    - loadtest
    image: locustio/locust:2.47.0
    command:
    - -f
    - /mnt/locust/load_test.py
    - --host
    - http://api-loadtest:8000
    - --web-host
    - 0.0.0.0
    - --web-port
    - '8089'
    - --class-picker
    environment:
      ALLOW_LIVE_LLM: '0'
    volumes:
    - ./tests/load_test.py:/mnt/locust/load_test.py:ro
    - ./tests/loadtest_support.py:/mnt/locust/loadtest_support.py:ro
    - ./tests/loadtest_warmup.py:/mnt/locust/loadtest_warmup.py:ro
    - ./reports/loadtest:/reports
    ports:
    - 127.0.0.1:${LOCUST_HOST_PORT:-8089}:8089
    networks:
    - default
    - loadtest
    depends_on:
      api-loadtest:
        condition: service_healthy
networks:
  loadtest:
    internal: true
volumes:
  runtime_qdrant: {}
  runtime_hf: {}
  runtime_prometheus: {}
  runtime_grafana: {}
